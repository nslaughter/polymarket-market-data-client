[project]
name = "polymarket-market-data-client"
version = "0.0.0.dev0"
description = "A read-only client for Polymarket's market WebSocket that reports every interruption, recovery, and capture gap."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# The ranges overlap polymarket-client 0.12.0's, websockets from 13 to below
# 16 and pydantic from 2 to below 3, so that the sdk extra installs beside
# them (D6, D8). Pydantic 2.0 made the defaults of a slotted dataclass
# read-only once a TypeAdapter had used it, and 2.1 validated a Decimal as a
# union, so an undecodable event's error named its inner validators instead
# of the field; 2.2 is the oldest that passes.
dependencies = [
    "pydantic>=2.2,<3",
    "websockets>=13,<16",
]

[project.optional-dependencies]
# The SDK that provides the default market lookup (D6).
sdk = ["polymarket-client==0.12.0"]

[project.urls]
Repository = "https://github.com/nslaughter/polymarket-market-data-client"

[dependency-groups]
dev = [
    "mypy>=1",
    "pytest>=8",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "polymarket_market_data"

[tool.ruff]
# The spikes are the investigation's evidence and are kept as they ran. Ruff
# would also format the Python in Markdown code blocks, and the documents,
# spec/ above all, change only on their own.
extend-exclude = ["spikes", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
# The contract writes its formulas with these.
allowed-confusables = ["×", "−"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
